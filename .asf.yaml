# This file controls the settings of this repository
#
# See more details at
# https://cwiki.apache.org/confluence/display/INFRA/Git+-+.asf.yaml+features

notifications:
  commits: commits@datafusion.apache.org
  issues: github@datafusion.apache.org
  pullrequests: github@datafusion.apache.org
  discussions: github@datafusion.apache.org
github:
  description: "Extensible SQL Lexer and Parser for Rust"
  labels:
    - big-data
    - rust
    - sql
  enabled_merge_buttons:
    squash: true
    merge: false
    rebase: false
  features:
    issues: true
    discussions: true
  protected_branches:
    main:
      required_status_checks:
        contexts:
          - "codestyle"
          - "lint"
          - "benchmark-lint"
          - "compile"
          - "docs"
          - "compile-no-std"
          - "test (stable)"
          - "test (beta)"
          - "test (nightly)"
          - "coverage"
          - "Release Audit Tool (RAT)"

  # GitHub merge queue settings for `main`.
  #
  # The merge queue is managed through rulesets
  # https://github.com/apache/infrastructure-asfyaml#rulesets
  #
  # Merge queue rules do not support wildcard ref patterns, so only the default
  # branch is covered.
  rulesets:
    - name: Merge Queue
      target: branch
      enforcement: active
      conditions:
        ref_name:
          include:
            - "~DEFAULT_BRANCH"
          exclude: []
      rules:
        - type: merge_queue
          parameters:
            # Matches enabled_merge_buttons above.
            merge_method: SQUASH
            # Every entry's own build must be green, not only the head of the
            # group.
            grouping_strategy: ALLGREEN
            # How many queue entries are built and tested concurrently.
            max_entries_to_build: 5
            # How many green entries may land in one merge operation (note this
            # does not combine CI builds)
            max_entries_to_merge: 1
            min_entries_to_merge: 1
            min_entries_to_merge_wait_minutes: 5
            # How long the queue waits for a required check to report before
            # treating it as failed and evicting the entry. Set to 6h to handle
            # periods of high runner queue times. See
            # https://github.com/apache/datafusion/issues/26292
            check_response_timeout_minutes: 360
  pull_requests:
    # enable updating head branches of pull requests
    allow_update_branch: true
    allow_auto_merge: true
