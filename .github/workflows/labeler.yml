name: labeler

# `pull_request_target` is disabled by ASF infra policy. The pull request path
# runs from the default branch when `pull_request_signal.yml` starts, so it
# never runs pull request code. See that file for details.
#
# `issues` and `issue_comment` already run from the default branch and are
# unchanged.
concurrency:
  group: ${{ github.repository }}-${{ github.event.workflow_run.head_repository.full_name || github.event.issue.number }}-${{ github.event.workflow_run.head_branch || github.event_name }}-${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_run:
    workflows: ["Pull request signal"]
    types: [requested]
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  label-dialects:
    name: Label dialects
    # Bot edits and comments arrive in bursts and never carry a dialect.
    if: >-
      github.event.sender.type != 'Bot' &&
      (
        (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request')
        || github.event_name == 'issues'
        || (github.event_name == 'issue_comment' && contains(github.event.comment.body, 'dialect'))
      )
    runs-on: ubuntu-latest
    # The token of a `workflow_run` workflow can update PRs from forks.
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # This checks out the default branch for `workflow_run`, never the pull request.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/workflows/labeler
          persist-credentials: false
      - uses: actions/github-script@v9
        with:
          script: |
            const label = require('./.github/workflows/labeler/label_dialects.js');
            if (context.eventName === 'workflow_run') {
              const pulls = await require('./.github/workflows/labeler/pull_requests_of_run.js')({ github, context });
              for (const pull of pulls) {
                await label({ github, context, pull });
              }
            } else {
              await label({ github, context });
            }
