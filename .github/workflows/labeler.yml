name: labeler

# pull_request_target runs on the base branch, so the script below is never taken from the PR head.
on:
  pull_request_target:
    types: [opened, edited]
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

jobs:
  label-dialects:
    name: Label dialects
    # Bot edits and comments arrive in bursts and never carry a dialect.
    if: >-
      github.event.sender.type != 'Bot' &&
      (github.event_name != 'issue_comment' || contains(github.event.comment.body, 'dialect'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/workflows/labeler
          persist-credentials: false
      - uses: actions/github-script@v9
        with:
          script: |
            const label = require('./.github/workflows/labeler/label_dialects.js');
            await label({ github, context });
