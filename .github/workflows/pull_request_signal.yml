# Signal for workflows that need a write token on a pull request.
#
# ASF infra policy disables `pull_request_target`
# (https://infra.apache.org/github-actions-policy.html), and GitHub is adding a
# default policy that blocks it. `labeler.yml` runs from the default branch on
# the `requested` event of this workflow and never checks out or runs pull
# request code.
#
# GitHub sends `workflow_run` `requested` at once for every run, even one that
# waits for first-time contributor approval. A pull request runs its own copy of
# this file, so changing or deleting it only skips dialect labels for that pull
# request. GitHub also skips `pull_request` workflows while a pull request has
# merge conflicts, so such a pull request gets its labels after a push that
# resolves them.
name: Pull request signal

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  signal:
    name: Signal pull request update
    runs-on: ubuntu-latest
    steps:
      - run: echo "This run triggers the workflow_run workflows that handle the pull request."
